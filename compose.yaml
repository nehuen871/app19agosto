name: utnfrba

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 4000
  DATABASE_URL: postgresql://${POSTGRES_USER:-utnfrba}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-utnfrba}
  ADMIN_ACCESS_TOKEN: ${ADMIN_ACCESS_TOKEN:?ADMIN_ACCESS_TOKEN is required}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:8081}

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]
  init: true

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-utnfrba}
      POSTGRES_USER: ${POSTGRES_USER:-utnfrba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: migrate
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: 'no'

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runner
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 12
    ports: ['127.0.0.1:${API_PORT:-4000}:4000']
    networks: [backend, frontend]
    restart: unless-stopped

  admin:
    <<: *hardening
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:4000/api/v1
      ADMIN_ACCESS_TOKEN: ${ADMIN_ACCESS_TOKEN:?ADMIN_ACCESS_TOKEN is required}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/admin/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports: ['127.0.0.1:${ADMIN_PORT:-3001}:3000']
    networks: [frontend]
    restart: unless-stopped

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
